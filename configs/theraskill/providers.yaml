# TheraSkillAgent provider configuration.
# Model names, URLs and credentials are configured in these two blocks.
# For machine-local overrides, use the ignored providers.local.yaml sibling.
active:
  llm: local_llm
  embedding: local_embedding

llm:
  model: Qwen3.8-27B
  base_url: http://127.0.0.1:8002/v1
  api_key: ""
  temperature: 0.0
  max_output_tokens: 4096
  timeout_seconds: 600
  retry_attempts: 1
  response_format_json: true
  ssl_verify: false

embedding:
  model: bge-m3
  base_url: http://127.0.0.1:8081/v1
  endpoint: http://127.0.0.1:8081/v1/embeddings
  api_key: ""
  timeout_seconds: 120
  retry_attempts: 2
  batch_size: 32
  ssl_verify: false
