# Copy to providers.local.yaml. Set model names, URLs and keys independently.
# The local file is ignored by Git and loaded automatically.
active:
  llm: local_llm
  embedding: local_embedding
llm:
  model: your-llm-model
  base_url: https://your-llm-service/v1
  api_key: ""
embedding:
  model: your-embedding-model
  base_url: https://your-embedding-service/v1
  endpoint: https://your-embedding-service/v1/embeddings
  api_key: ""
