[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theraskill-knowledge-extraction"
version = "0.1.0"
description = "Clean, configurable TheraSkill knowledge extraction and release surfaces"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "json-repair>=0.30.0"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
