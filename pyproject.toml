[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theraskill-agent"
version = "0.5.0"
description = "Standalone skill-based therapeutic knowledge, simulation, review and text agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "python-dotenv>=1.1",
  "pydantic>=2.8",
  "fastapi>=0.104",
  "uvicorn>=0.24",
  "httpx>=0.27",
  "json-repair>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]
retrieval = ["numpy>=1.26", "faiss-cpu>=1.13.2"]

[project.scripts]
theraskill-agent = "theraskill_agent.cli:main"

[tool.setuptools.packages.find]
include = [
  "theraskill_agent",
  "theraskill_agent.*",
  "domains.theraskill",
  "domains.theraskill.*",
  "plugins.theraskill",
  "plugins.theraskill.*",
  "installers.theraskill",
  "installers.theraskill.*",
]

[tool.setuptools.package-data]
"plugins.theraskill" = ["plugin.yaml", "skills/**/*.md", "skills/**/*.yaml", "skills/**/*.json"]
